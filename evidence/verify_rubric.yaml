rubrics:
- id: 1
  type: p2p
  text: 没有排队或运行检查时，单个 UI、列表批量、REST DELETE、处理器切换和全局清理仍删除历史、截图与抓取结果，并保留 Watch、处理器专用配置、暂停和调度设置。
- id: 2
  type: f2p
  text: 清空开始前已经领取任务的 worker 即使迟到完成，也不能把快照、history、截图、抓取 HTML、错误状态或检查计数写回清空后的监控。
- id: 3
  type: f2p
  text: 清空边界建立前已经排队但尚未发送的变更通知不得在边界后发出，而边界后新检查产生的通知仍按现有设置发送。
- id: 4
  type: f2p
  text: 清空成功后只由正常调度产生边界后的首个新检查，旧任务的释放或取消不会释放、取消或污染新任务，新的首个快照语义正确。
- id: 5
  type: f2p
  text: 文件删除、Watch 提交或运行任务收敛失败时，入口或后台任务记录明确失败并可重试，不会把半清状态报告为成功。
- id: 6
  type: f2p
  text: 全局后台清理在部分监控失败、线程退出或进程重启后能够继续或安全重试，不删除边界之后的新历史，也不会永久保持运行中状态。
- id: 7
  type: f2p
  text: 重复或并发清空具有确定的边界和所有权，迟到清理不能越过较新的清空边界或删除已经由新检查建立的历史。
