rubrics:
- id: 1
  type: p2p
  text: 没有并发写入时，后台创建、latest 下载、备份数量限制、UTF-8 URL/tag 和现有合法归档的恢复行为不回归。
- id: 2
  type: f2p
  text: 检查在归档期间完成时，当前 ZIP 对每个 watch 只包含一个完整已提交边界；history.txt 中每个条目都有对应可读取快照，下一次备份可包含更新代际。
- id: 3
  type: f2p
  text: watch.json、当前处理器 JSON、history 索引、截图/HTML等被纳入的附属结果来自同一选择边界，恢复后 worker 和 UI
    不会观察混合配置或缺失资源。
- id: 4
  type: f2p
  text: 历史裁剪或并发删除使已选择文件消失时，整份候选备份失败而不是跳过文件发布；旧备份保持可用，后续重试能够创建完整新备份。
- id: 5
  type: f2p
  text: 读取、压缩、关闭或最终 rename 失败时不会出现可下载的新 .zip，临时文件和运行标记得到清理，并向创建页面留下可诊断结果。
- id: 6
  type: f2p
  text: 进程或线程在候选写完但发布前中断后，启动或下一次请求能确定清理未完成候选，不覆盖同名已完成归档，也不会永久认为备份仍在运行。
- id: 7
  type: f2p
  text: 备份一致性机制不会用一个覆盖全部检查时长的全局停机锁阻塞正常 worker；并发检查可继续完成，而归档通过明确的提交边界保持可恢复。
